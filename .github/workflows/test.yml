name: Rust tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_repository:
        description: Optional owner/repository for the real SFU integration job (must contain backend/)
        required: false
        default: ''
      backend_ref:
        description: Backend revision for the real SFU integration job
        required: false
        default: '41cb00e'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # EN-US: Keep Fedora's GTK version while running containers without host-root capabilities.
    # PT-BR: Mantém o GTK do Fedora com contêineres sem capacidades de root do host.
    defaults:
      run:
        shell: bash packaging/ci/run-fedora.sh {0}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
      # EN-US: Virtual-display tests must not require a host GPU/OpenGL driver.
      # PT-BR: Testes em tela virtual não devem exigir GPU/driver OpenGL do host.
      GSK_RENDERER: cairo
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare rootless Fedora test environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
          podman info
          podman build -t localhost/papo-ci:fedora44 packaging/ci
      - name: Check namespace and sandboxed PNG/SVG loading before GTK
        id: runtime
        env:
          G_MESSAGES_DEBUG: all
        run: |
          mkdir -p target/ci
          python3 packaging/ci/runtime_probe.py 2>&1 | tee target/ci/runtime.log
      - name: Check Windows provenance and retained input policy
        run: python3 -m unittest discover -s tests -p 'windows_packaging_test.py'
      - name: Check AppImage media plugin and host driver boundaries
        run: python3 -m unittest discover -s tests -p 'appimage_packaging_test.py'
      - name: Check call sound decoding and application audio identity
        run: python3 -m unittest discover -s tests -p 'call_sound_test.py'
      - name: Check bundled control icon coverage
        run: python3 -m unittest discover -s tests -p 'icon_assets_test.py'
      - name: Compile application and run unit and integration tests
        run: cargo test --locked 2>&1 | tee target/ci/unit.log
      - name: Reject local media playlists before decoder discovery
        run: python3 tests/security/media_network_probe.py
      - name: Run all focused GTK cases and retain individual failures
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: bash packaging/ci/gui-checks.sh
      - name: Check private screen portal permissions and cleanup
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: dbus-run-session -- python3 tests/portal_probe.py
      - name: Check native audio worker cleanup using synthetic capture
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: cargo test --locked native_voice -- --ignored

      - name: Retain Linux runtime and individual GUI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-CI-diagnostics
          path: |
            target/ci/runtime.log
            target/ci/unit.log
            target/ci/gui/
          if-no-files-found: warn

  voice-sfu:
    if: github.event_name == 'workflow_dispatch' && inputs.backend_repository != ''
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install native media runtime
        run: dnf install -y git gcc gdk-pixbuf2 python3-gobject python3-gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free libnice-gstreamer1
      - uses: actions/checkout@v4
        with:
          path: papo-gtk
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend_repository }}
          ref: ${{ inputs.backend_ref }}
          path: papo-backend
      - uses: actions/setup-go@v6
        with:
          go-version-file: papo-backend/backend/go.mod
          cache-dependency-path: papo-gtk/tests/voice-sfu/go.sum
      - name: Build isolated SFU and local TURN fixture
        working-directory: papo-gtk/tests/voice-sfu
        run: go build -mod=readonly -o /tmp/papo-voice-sfu .
      - name: Exchange real decoded audio using direct ICE and forced TURN relay
        working-directory: papo-gtk
        run: python3 tests/voice_probe.py
      - name: Exchange decoded camera and screen video, switch publishers and repeat capture
        working-directory: papo-gtk
        run: |
          python3 tests/video_probe.py
          python3 tests/video_probe.py --relay
