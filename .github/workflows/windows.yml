name: Windows developer preview

on:
  push:
    branches: [multiplatform]
  pull_request:
    branches: [multiplatform]
  workflow_dispatch:
    inputs:
      packaging_only:
        description: Rebuild packaging for code already covered by native tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: '-D warnings'
      GSK_RENDERER: cairo
      GTK_A11Y: none
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record checkout Git configuration before MSYS2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/windows-build | Out-Null
          git --version | Out-File -Encoding utf8 target/windows-build/checkout-git.txt
          git config --show-origin --get-regexp '^core\.(autocrlf|eol|filemode|symlinks|ignorecase)$' | Out-File -Append -Encoding utf8 target/windows-build/checkout-git.txt
          git status --porcelain=v1 --untracked-files=all | Out-File -Append -Encoding utf8 target/windows-build/checkout-git.txt
          git diff --stat HEAD | Out-File -Append -Encoding utf8 target/windows-build/checkout-git.txt
          git diff --summary HEAD | Out-File -Append -Encoding utf8 target/windows-build/checkout-git.txt
          git ls-files --eol | Out-File -Append -Encoding utf8 target/windows-build/checkout-git.txt
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            git
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libnice
      - name: Diagnose source differences with MSYS2 Git before compiling
        run: |
          python - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("packaging/windows").resolve()))
          from build import source_state, write_json, require_source
          source = source_state()
          write_json(Path("target/windows-build/post-setup.json"), source)
          print(source["status"] or "Clean source checkout")
          print(source["diff_summary"])
          print(source["git_config"])
          require_source(source)
          PYCODE
      - name: Test source provenance and package archive verification
        run: python -m unittest discover -s tests -p 'windows_*test.py'
      - name: Retain exact installed native dependency packages
        run: python packaging/windows/native_inputs.py capture target/windows-native-inputs
      - name: Record native toolchain and build options before compilation
        run: python packaging/windows/build.py --preflight --native-inputs target/windows-native-inputs
      - name: Select explicit UCRT64 runtime for unbundled developer tests
        run: echo "PAPO_RUNTIME_DIR=$(cygpath -w "$MINGW_PREFIX")" >> "$GITHUB_ENV"
      - name: Check every Rust target on Windows
        if: github.event_name != 'workflow_dispatch' || !inputs.packaging_only
        run: cargo check --locked --all-targets
      - name: Test platform policy and native worker lifecycle with synthetic audio
        if: github.event_name != 'workflow_dispatch' || !inputs.packaging_only
        run: |
          cargo test --locked platform:: -- --test-threads=1
          cargo test --locked native_voice -- --ignored --test-threads=1
      - name: Test embedded icon coverage and native GTK rendering
        if: github.event_name != 'workflow_dispatch' || !inputs.packaging_only
        run: |
          python -m unittest discover -s tests -p platform_capture_test.py
          python -m unittest discover -s tests -p icon_assets_test.py
          PAPO_UI_CASE=symbolic-icons cargo test --locked ui_smoke -- --ignored --test-threads=1
          PAPO_UI_CASE=startup cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Build and validate self-contained portable preview
        run: |
          papo_build_options=()
          if [[ "${{ inputs.packaging_only }}" == "true" ]]; then
            papo_build_options+=(--packaging-only)
          fi
          python packaging/windows/build.py --native-inputs target/windows-native-inputs "${papo_build_options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: Papo-Windows-x86_64-developer-preview
          path: |
            dist/Papo-*-windows-x86_64-dev.zip
            dist/Papo-*-windows-x86_64-dev.zip.sha256
          if-no-files-found: error

      - name: Retain source and toolchain diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            target/windows-build/*.json
            target/windows-build/checkout-git.txt
          if-no-files-found: warn
      - name: Retain native rebuild inputs separately from the preview ZIP
        if: ${{ always() && hashFiles('target/windows-native-inputs/NATIVE-INPUTS.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Windows-UCRT64-native-inputs
          path: target/windows-native-inputs/
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn

  portable-runtime:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Papo-Windows-x86_64-developer-preview
          path: download
      - name: Validate portable ZIP without developer discovery paths
        shell: pwsh
        run: ./packaging/windows/check-portable.ps1

  macos-foundation:
    if: github.event_name != 'workflow_dispatch' || !inputs.packaging_only
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native GTK build dependencies
        run: brew install pkgconf gtk4 libadwaita
      - name: Compile and link tests and the native Keychain adapter (no macOS bundle yet)
        run: |
          cargo check --locked --all-targets
          cargo test --locked --no-run
