name: Rust tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_repository:
        description: Optional owner/repository for the real SFU integration job (must contain backend/)
        required: false
        default: ''
      backend_ref:
        description: Backend revision for the real SFU integration job
        required: false
        default: '41cb00e'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The manifest requires GTK >= 4.12 and libadwaita >= 1.6.
    container: fedora:44
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Install Rust and native build dependencies
        run: dnf install -y git gcc rust cargo pkgconf-pkg-config glib2-devel openssl-devel gtk4-devel libadwaita-devel python3-gobject python3-gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free libnice-gstreamer1 xorg-x11-server-Xvfb xorg-x11-xauth setxkbmap libXtst dbus-daemon
      - uses: actions/checkout@v4
      - name: Check AppImage media plugin and host driver boundaries
        run: python3 -m unittest discover -s tests -p 'appimage_packaging_test.py'
      - name: Check call sound decoding and application audio identity
        run: python3 -m unittest discover -s tests -p 'call_sound_test.py'
      - name: Compile application and run unit and integration tests
        run: cargo test --locked
      - name: Check login, chat workflows and adaptive layouts under a virtual display
        run: dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check multiline composer, wrapping and dead-key input
        run: PAPO_UI_CASE=multiline PAPO_NATIVE_INPUT_TEST=1 GTK_IM_MODULE=simple dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check dead-key input after full application startup
        run: PAPO_UI_CASE=full-app-input PAPO_NATIVE_INPUT_TEST=1 GTK_IM_MODULE=simple dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check dead-key input across login-to-chat focus handoff
        run: PAPO_UI_CASE=login-input PAPO_NATIVE_INPUT_TEST=1 GTK_IM_MODULE=simple dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check explicit channel reads and owner-only account recovery
        run: PAPO_UI_CASE=backend-update dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check rich cards and quoted Twitter/X embeds
        run: PAPO_UI_CASE=embeds dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check bounded embed colors, theme changes and provider cleanup
        run: PAPO_UI_CASE=style-palette dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check uploaded GIF motion and media download actions
        run: PAPO_UI_CASE=attachment-media dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check video posters and compressed media reuse across channels
        run: PAPO_UI_CASE=media-cache dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check member groups, Markdown, emoji tabs and channel actions
        run: PAPO_UI_CASE=report8 dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check responsive emoji grids, lazy pages and animation cleanup
        run: PAPO_UI_CASE=emoji-grid dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check collapsed channel and DM notification groups and unread counts
        run: PAPO_UI_CASE=notification-filters dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check grouped notification read batching, retries and live events
        run: PAPO_UI_CASE=account-notices dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check tabbed account settings, retained drafts and password cleanup
        run: PAPO_UI_CASE=account-settings dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check webhook message grouping, avatar queues and cache reuse
        run: PAPO_UI_CASE=webhook-chat dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check GIF link animations, compact editing and autocomplete keyboard routing
        run: PAPO_UI_CASE=report9 PAPO_NATIVE_INPUT_TEST=1 GTK_IM_MODULE=simple dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check readable edit mentions, user replacement and native accented input
        run: PAPO_UI_CASE=edit-mentions PAPO_NATIVE_INPUT_TEST=1 GTK_IM_MODULE=simple dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check inline emoji details, animation, spoilers and popover cleanup
        run: PAPO_UI_CASE=emoji-details PAPO_NATIVE_INPUT_TEST=1 dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check backend GIF media, cache reuse and temporary chat errors
        run: PAPO_UI_CASE=backend-gifs dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check viewport avatars, recycled search, motion and reconnect recovery
        run: |
          for scenario in avatar-viewport search-recycling emoji-notifications notification-window recovery media-loading recent-media; do
            PAPO_UI_CASE="$scenario" dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
          done
      - name: Check staged attachment previews and clipboard uploads
        run: |
          for scenario in draft-previews clipboard; do
            PAPO_UI_CASE="$scenario" dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
          done
      - name: Check Unicode emoji categories and search
        run: PAPO_UI_CASE=emoji-categories dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check pinned-message media and scoped playback
        run: PAPO_UI_CASE=pins-media dbus-run-session -- xvfb-run -a cargo test --locked ui_smoke -- --ignored --test-threads=1
      - name: Check private screen portal permissions and cleanup
        run: dbus-run-session -- python3 tests/portal_probe.py
      - name: Check native audio worker cleanup using synthetic capture
        run: cargo test --locked native_voice -- --ignored

  voice-sfu:
    if: github.event_name == 'workflow_dispatch' && inputs.backend_repository != ''
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install native media runtime
        run: dnf install -y git gcc gdk-pixbuf2 python3-gobject python3-gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free libnice-gstreamer1
      - uses: actions/checkout@v4
        with:
          path: papo-gtk
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend_repository }}
          ref: ${{ inputs.backend_ref }}
          path: papo-backend
      - uses: actions/setup-go@v6
        with:
          go-version-file: papo-backend/backend/go.mod
          cache-dependency-path: papo-gtk/tests/voice-sfu/go.sum
      - name: Build isolated SFU and local TURN fixture
        working-directory: papo-gtk/tests/voice-sfu
        run: go build -mod=readonly -o /tmp/papo-voice-sfu .
      - name: Exchange real decoded audio using direct ICE and forced TURN relay
        working-directory: papo-gtk
        run: python3 tests/voice_probe.py
      - name: Exchange decoded camera and screen video, switch publishers and repeat capture
        working-directory: papo-gtk
        run: |
          python3 tests/video_probe.py
          python3 tests/video_probe.py --relay
